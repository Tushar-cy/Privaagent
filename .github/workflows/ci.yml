name: Privaagent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    env:
      SESSION_TOKEN: ci-test-token-privaagent
      VLM_PROVIDER: mock

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install Node Dependencies
        run: |
          cd extension
          npm ci

      - name: Install Python Dependencies
        run: |
          cd server
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx httpx2

      - name: Compile TypeScript Verification
        run: |
          cd extension
          npx tsc --noEmit

      - name: Run Extension Automated Security & Privacy Tests
        run: |
          cd extension
          npx tsx ../tests/test_dom_perception.mjs
          npx tsx ../tests/test_privacy_engine.mjs
          npx tsx ../tests/test_local_vision.mjs
          npx tsx ../tests/test_agent_and_backend.mjs
          npx tsx ../tests/test_validator.mjs
          npx tsx ../tests/test_ui_and_overlays.mjs
          npx tsx ../tests/test_multiturn_agent.mjs
          npx tsx ../tests/test_compliance_audit.mjs
          npx tsx ../tests/test_synthetic_replacer_and_audit_vault.mjs
          npx tsx ../tests/test_redteam_security.mjs

      - name: Run FastAPI Backend API, Visual Contract, and Schema Tests
        run: |
          cd server
          python -m pytest -p no:cacheprovider ../tests/test_backend_api.py ../tests/test_backend_visual_contract.py ../tests/test_contracts.py -v

      - name: Run Internal 5-Metric Benchmark Smoke Test
        run: |
          cd extension
          npx tsx ../benchmark/scripts/run-benchmark.mjs
